# env/sample.yaml -- unified config for the `solace` CLI. Copy to env/<name>.yaml
# and edit; run any command with `-e <file>`. One file drives all three
# platforms (k8s, docker, podman); each reads only the sections it needs.
#
# This is a TEMPLATE with placeholder secrets. Replace admin.pass, the image
# credentials, and nodes.psk before real use, and never commit real secrets.
#
# Every secret field has a sibling *Env key holding the NAME of an environment
# variable to read the value from instead -- `pass: CHANGE-ME` or
# `passEnv: SOLACE_ADMIN_PASS`, never both. With the *Env form this whole file
# carries no secret and is safe to commit; the variables must be exported before
# any command runs, or the load fails loud naming the key and the variable.
#
# Secrets never reach a deployment artifact, and every platform delivers them to
# the broker as files: on containers each one is externalized (podman's secret
# store; docker compose secrets sourced from the environment `deploy` passes it)
# and mounted at /run/secrets/<setting>, and on k8s they live in Secret manifests
# applied on stdin and mounted by the operator. So `--gen-only` output is safe to
# share, while `--gen-secrets-only` output is as sensitive as this file.
#
# EVERY key the schema accepts appears below. A commented-out key is optional --
# the value shown is the default that applies when it is omitted. Keys marked
# "mandatory" must be set, or the load fails loud naming every one that is
# missing. Decoding is strict: an unknown or misspelled key is a hard error, so
# a typo can never pass silently.

# HA topology, unified across platforms: yes = redundancy group (primary+backup
# +monitor); no = a single standalone broker. Omitting it means "no": HA
# provisions three brokers (and three PVCs on k8s), so it is opted into, never
# inherited by accident.
redundancy: yes

# Broker timezone, unified across platforms: the k8s CR's timezone and the
# containers' TZ are the same knob. Omitted -> the broker keeps the image default.
# timezone: Asia/Singapore

image:
  repo: solace-pubsub-standard      # mandatory
  tag: "10.26.0.8755"                # mandatory
  registry: registry.example.com   # optional prefix; omit for docker.io
  pullSecret: solace-image-pull     # k8s: name of the image-pull secret
  user: repo-user                   # registry login: k8s builds the pull secret,
  pass: CHANGE-ME-registry          # docker/podman run `<runtime> login`. secret
  # passEnv: SOLACE_REGISTRY_PASS   # ...or name the variable holding it instead
  # pullPolicy: IfNotPresent        # k8s: Always | IfNotPresent | Never. Always for
                                    # a moving tag, Never for an air-gapped cluster

admin:
  user: admin                       # container admin username (k8s admin is "admin")
  pass: CHANGE-ME-admin             # secret, mandatory on every platform
  # passEnv: SOLACE_ADMIN_PASS      # ...or name the variable holding it instead
  monitorPass: CHANGE-ME-monitor    # k8s monitor user secret
  # monitorPassEnv: SOLACE_MON_PASS # ...or name the variable holding it instead
  # additionalUsers:                # extra CLI (management) users beyond admin/monitor.
  #   - username: appuser           # Every field is required; password takes the same
  #     accessLevel: read-only      # literal-or-passwordEnv choice as above.
  #     password: CHANGE-ME-appuser # accessLevel: none | read-only | mesh-manager |
  #   - username: rouser            #   read-write | admin
  #     accessLevel: mesh-manager   # Containers create these at boot. On k8s they are
  #     passwordEnv: SOLACE_ROPASS  # created by `config additional-users` over the
                                    # broker CLI (the operator ignores extra keys in
                                    # the credentials Secret), which is NOT re-runnable
                                    # and rejects : ( ) " ; ' < > , ` \ * & | in a
                                    # password. Those characters stay fine on
                                    # docker/podman, which mount the value as a file.

tls:
  cert: certs/tls.crt               # server certificate (enables broker TLS listeners)
  certKey: certs/tls.key
  # certPassphrase: CHANGE-ME-pass  # secret; only when the key is encrypted. On
                                    # docker/podman it is externalized like the admin
                                    # password and reaches the broker as
                                    # tls_servercertificate_passphrasefilepath. Not
                                    # wired on k8s: the operator mounts the TLS secret.
  # certPassphraseEnv: SOLACE_TLS_PASS   # ...or name the variable holding it instead
  serverSecret: solace-tls-secret   # k8s: TLS secret name (enables the CR tls block)
  # cas:                            # trusted domain CA files (config domain-certs)
  #   - certs/ca.crt

# scaling: omit to take platform defaults (k8s and container differ). Override any:
#
# maxConnections is the Solace scaling tier, and it FIXES the broker's CPU on every
# platform -- there is no cpu key anywhere in this schema. It must be exactly one of
# the five values below; a value between tiers is rejected, not rounded, because
# Solace publishes no sizing for it. Memory is the tier's default and stays yours to
# override (k8s.msgNode.mem, docker/podman container.mem).
#
#   maxConnections | cpu (fixed) | memory default
#   ---------------+-------------+----------------
#   100            | 2           | 3410Mi  (k8s default tier)
#   1000           | 2           | 6898Mi  (container default tier)
#   10000          | 4           | 12435Mi
#   100000         | 8           | 30925Mi
#   200000         | 12          | 52581Mi
#
# Every knob below applies to every platform. Only the delivery differs: k8s writes
# them into the broker CR's spec.systemScaling, while docker and podman pass them to
# the container as environment variables under the broker's own setting names
# (system_scaling_*, messagespool_maxspoolusage). Two of the defaults differ by
# platform, marked below; the rest are the same either way.
#
# scaling:
#   maxConnections: 100             # k8s default 100, container default 1000
#   maxSpoolUsageMB: 10000          # k8s default 10000, container default 100000
#   maxQueueMessages: 100
#   maxKafkaBridge: 0
#   maxKafkaConnections: 0
#   maxBridges: 25
#   maxSubscriptions: 50000
#   maxGuaranteedMsgMB: 10

# replication: parsed from the legacy REPL_* variables by `solace convert` and kept
# in the schema, but NO command in this binary reads it yet -- the block is
# currently inert. Configure data replication with the standalone
# solace-replication-generator.html, or push a CLI script with `config exec-cli`.
# replication:
#   mate: mate-router-name          # remote mate router ("v:" prefix optional)
#   connSsl:                        # mate-link host:port entries
#     - remote-host:55443
#   psk: ""                         # secret; generated when left blank

k8s:
  # runtime: kubectl                # the cluster CLI (legacy KUBE). A scalar is split
                                    # on whitespace, so it can carry a whole profile:
                                    # `oc` or `kubectl --kubeconfig /path/.kubeconfig-dev`.
                                    # THIS FIELD RUNS A BINARY ON YOUR MACHINE, so it
                                    # is restricted: a bare name (no / or \) from
                                    # {kubectl, oc}, then flags only -- no bare word,
                                    # which would smuggle a subcommand ahead of the one
                                    # the tool appends. A wrapper such as
                                    # `microk8s kubectl` needs the operator to approve
                                    # it per run: --allow-command microk8s. Windows
                                    # paths in a flag value take forward slashes
                                    # (C:/Users/you/.kube/config). See README,
                                    # "The command fields are executable content".
  name: dev-broker                  # mandatory
  namespace: solace                 # mandatory
  adminSecret: solace-admin-secret  # Secret holding the admin/monitor credentials.
                                    # additionalUsers are NOT in it: the operator reads
                                    # only those two keys (see admin.additionalUsers)
  updateStrategy: automatedRolling  # automatedRolling | manualPodRestart
  serviceAccount: solace-sa         # optional
  # cliScriptsFolder: cli           # local folder holding .cli scripts (config exec-cli)
  # diagDir: diag-configs           # local folder for verify diagnostics output
  # securityContext:                # -> spec.securityContext; omitted entirely when unset
  #   runAsUser: "1000001"          # "0" asks OpenShift to auto-assign
  #   fsGroup: "1000002"
  # containerSecurity:              # -> spec.brokerContainerSecurity
  #   runAsUser: "1000001"
  #   runAsGroup: "1000002"
  #   readOnlyRootFilesystem: false # broker 10.9+
  storage:
    class: standard                 # StorageClass; omit to use the cluster default
    msgNode: 30Gi                   # mandatory
    monNode: 5Gi
  # msgNode:                        # message-node pod resources. There is no cpu
  #   mem: 3410Mi                   # key: CPU is fixed by scaling.maxConnections
                                    # (see the tier table above), and setting one is
                                    # a load-time error. mem defaults to that tier's
                                    # memory and stays overridable here.
  # operator:                       # cluster-scoped EventBroker Operator
  #   image: docker.io/solace/pubsubplus-eventbroker-operator:1.4.0
  #   namespace: pubsubplus-operator-system  # omit to discover the running one
  #   watchNamespaces: ""           # comma-separated list; empty = the broker ns only
  #   watchBrokerNs: true           # also watch k8s.namespace
  #   cpu: 500m
  #   mem: 512Mi
  loadBalancer:
    ip: 10.0.0.50                   # MetalLB requested IP (optional)
  #   ipPool: sample-ip-pool        # MetalLB address-pool name
  #   annotations:                  # extra service annotations, "key: value"
  #     - "external-dns.alpha.kubernetes.io/hostname: broker.example.com"
  # ports:                            # name=containerPort[:servicePort][/proto]
  #  - tcp-semp=8080
  #  - tcp-smf=55555:55556
  #  - tls-smf=55443/TCP
  # podAnnotations:                 # -> spec.podAnnotations (key and value are quoted
  #   prometheus.io/scrape: "true"  # for you, so any value is safe)
  # podLabels:                      # -> spec.podLabels
  #   example.com/tier: messaging
  # placement:                      # optional pod scheduling
  #   labelsPrimary: ["nodetype: solace"]
  #   labelsBackup: []
  #   labelsMonitor: []
  #   tolerationsPrimary: ["dedicated=solace:NoSchedule"]
  #   tolerationsBackup: []
  #   tolerationsMonitor: []
  #   antiAffinityNamespaces: []    # default: [k8s.namespace]; drives the built-in
  #   antiAffinityWeight: 100       # one-broker-per-host spread
  #   nodeAffinity:                 # additive; unset leaves the CR exactly as above
  #     preferred:                  # weight 1-100 + ANDed match expressions
  #       - weight: 80
  #         match:
  #           - {key: topology.kubernetes.io/zone, operator: In, values: [az-1]}
  #     required:                   # one ANDed term; operator In|NotIn|Exists|
  #       - {key: solace.com/broker, operator: Exists}   # DoesNotExist|Gt|Lt
  #   podAffinity: []               # terms: weight 0 = required, 1-100 = preferred;
  #   podAntiAffinity: []           # each needs topologyKey, plus optional
                                    # matchLabels and namespaces. Appended after the
                                    # antiAffinityNamespaces term above.
  # Intentionally unsupported here (edit the CR or use kubectl if you need them):
  #   monitoring (the Prometheus exporter sidecar), service.type (always
  #   LoadBalancer) and per-port nodePort, extraEnvVars/extraEnvVarsCM/
  #   extraEnvVarsSecret.
  # There is deliberately no k8s health check either: the operator already runs its
  # own readiness and liveness probes on the broker pods and gates service traffic
  # on them, so overriding that would only risk fighting it. healthCheck exists
  # solely under docker:/podman:, where no such supervisor exists.
  # productKeys: []                 # config product-keys
  # domainCerts:
  #   folder: certs
  #   files: {}                     # CA-NAME: cert filename

docker:
  # runtime: docker                 # command to exec: a bare binary name from
                                    # {docker, docker-compose, nerdctl}, then flags
                                    # only. Same rules as k8s.runtime above -- this
                                    # field runs a binary on your machine. A wrapper
                                    # such as `lima nerdctl` needs the operator to
                                    # approve it per run: --allow-command lima.
                                    # sudo/doas/su/pkexec are NEVER approvable here;
                                    # run `sudo solace docker deploy` instead, so the
                                    # privilege belongs to one invocation you chose.
  mode: compose                     # compose (the only value; run mode was removed)
  # compose: docker compose         # the compose invocation. Omitted -> the runtime
                                    # plus `compose` (the plugin form). Set it to
                                    # `docker-compose` on a host carrying only the
                                    # standalone v1 binary. Same rules as runtime,
                                    # plus one permitted trailing `compose`; every
                                    # argument is appended after it.
  # composeFile: docker-compose.yml # path of the generated compose file. It names the
                                    # secrets it needs; `deploy` supplies their values
                                    # through the compose process environment, so no
                                    # secret is written beside it.
  container:
    dataDir: /opt/solace/data       # host bind mount, mandatory
  #   name: solace                  # container name; also prefixes this host's secret
                                    # names, so two brokers on one host cannot clash
  #   runUser: "0:0"                # uid:gid the container runs as
  #   shmSize: 1g
  #   mem: 6898m                    # memory limit, in docker's/podman's own b|k|m|g
                                    # suffix -- NOT the Mi/Gi k8s.msgNode.mem takes.
                                    # Defaults to the scaling.maxConnections tier's
                                    # memory (container default tier 1000 -> 6898m).
                                    # There is no cpu key: it is fixed by the tier.
  #   ulimits:
  #     nofile: "2448:1048576"
  #     memlock: "-1"
  #     core: "-1"
  #   healthCheck:                  # opt-in; off leaves the artifact unchanged
  #     enabled: true               # polls the broker's own readiness endpoint,
                                    # curl -fs http://localhost:5550/health-check/readiness,
                                    # so `docker ps`/`compose ps` and podman's
                                    # auto-restart see readiness, not just liveness.
                                    # REQUIRES broker 10.26 or later (where that
                                    # endpoint was introduced) AND a version-numbered
                                    # image.tag to prove it -- enabling it on an older
                                    # or a "latest"-tagged image fails loud rather than
                                    # deploying a probe that can never pass.
  #     cmd: [curl, -fs, "http://localhost:8080/SEMP/v2/monitor"]
                                    # optional: your own probe argv, run inside the
                                    # container. Setting it skips the version check --
                                    # this is how to probe a pre-10.26 broker. Podman
                                    # renders it as a command line, so avoid tokens
                                    # with spaces; wrap such a probe in a script.
  #     interval: 5s                # the defaults shown are what applies when omitted
  #     timeout: 5s
  #     retries: 3
  #     startPeriod: 60s
  # network:
  #   mode: host                    # host | bridge
  #   ports:                        # host:container. Omitted in bridge mode, the
  #     - 8080:8080                 # same 17 ports k8s defaults to are published

podman:
  # runtime: podman                 # command to exec; same rules as docker.runtime,
                                    # allowing only the bare name `podman`
  rootless: false                   # true = rootless: user systemd + `podman unshare` chown
  # quadletDir: /etc/containers/systemd   # rootless: $XDG_CONFIG_HOME/containers/systemd
  container:
    dataDir: /opt/solace/data       # mandatory
  #   name: solace
  #   runUser: "0:0"
  #   shmSize: 1g
  #   mem: 6898m                    # same rules as docker.container.mem
  #   ulimits:
  #     nofile: "2448:1048576"
  #     memlock: "-1"
  #     core: "-1"
  #   healthCheck:                  # same shape as docker.container.healthCheck
  #     enabled: true               # built-in readiness probe; needs broker 10.26+
  # network:
  #   mode: host
  #   ports:
  #     - 8080:8080

nodes:                              # redundancy group -- identical on all hosts
  primary:
    name: solace-primary            # mandatory on containers (the broker's routername)
    ip: 10.0.0.11                   # mandatory on containers in HA
  backup:
    name: solace-backup             # mandatory on containers in HA
    ip: 10.0.0.12
  monitor:
    name: solace-monitor            # mandatory on containers in HA
    ip: 10.0.0.13
  psk: Q0hBTkdFLU1FLXByZXNoYXJlZC1rZXktYmFzZTY0     # secret; host-prep generates one
  # pskEnv: SOLACE_REDUNDANCY_PSK   # ...or name the variable holding it instead. With
                                    # this form host-prep generates nothing: create the
                                    # key yourself (openssl rand -base64 60) and export
                                    # the SAME value on all three hosts.
